# Documentation Reference:
# https://rclone.org/docs/
# https://rclone.org/gui/
# https://rclone.org/install/#docker
#
# Required variables. Supply them however suits: common.env, a second
# --env-file, the shell environment, or Portainer's stack variables. Guarded,
# so Compose refuses to start rather than interpolating an empty string.
#
#   SERVICE_DOMAIN        - Traefik host rules, e.g. local.example.com
#   BASE_VOLUME_DIRECTORY - host path exposed to rclone as /data
#   RCLONE_GUI_USER       - login for the web GUI and the remote control API
#   RCLONE_GUI_PASS       - password for that login
#
# Sync and copy between local paths and around 70 cloud backends, with
# rsync-shaped semantics. services/garage is one of them, reachable as an S3
# remote at http://garage:3900 over `proxy`.
#
# Two hostnames, the way nexus has two. `rclone gui` serves the GUI and the
# remote control API on separate listeners and refuses to share one port -- it
# exits with "address already in use" if both are pointed at the same one. The
# browser talks to the API directly rather than through the GUI server, so the
# API needs its own route rather than being kept internal.
#
#   rclone.$SERVICE_DOMAIN      - the web GUI
#   rclone-api.$SERVICE_DOMAIN  - the remote control API the GUI calls
#
# Because those are different origins, --rc-allow-origin is required or every
# call the GUI makes is blocked by CORS.
#
# The GUI is told which API to talk to at login, as a query parameter, and its
# login form has fields for the user and password but none for the URL. Visiting
# the bare hostname therefore always fails with "URL is not configured. Start
# the GUI launcher again.", because there is nowhere to type the address.
#
# The redirectregex middleware below rewrites the root to the login page with
# all three parameters. All three is not belt and braces: the GUI treats the
# presence of any one of url, user or pass as "connect now" and immediately
# submits rather than waiting for the form. A url on its own therefore connects
# with empty credentials, takes a 401, and the auth handler responds with
# window.location.replace("/login?reason=auth") -- a full page load, which
# discards the URL it was just given, since the store only persists after a
# successful connect. The result is the same "URL is not configured" the plain
# hostname gives. A partial set is worse than none.
#
# The cost is the password appearing in the redirect, so it reaches the Location
# header and anything logging it, Traefik's access log included. The GUI strips
# the three parameters from the address bar with a replace-style navigation as
# soon as it reads them, so they do not linger in browser history, and after one
# successful connect the values live in localStorage and the bare hostname works
# on its own. Keep RCLONE_GUI_PASS to A-Za-z0-9: an & or = in it would end the
# query parameter early and break the redirect.
#
# The GUI is embedded in the binary at build time as of rclone 1.74, so nothing
# is fetched at runtime. The older `rcd --rc-web-gui` serves both on one port,
# which would be a single Traefik router, but it downloads the previous React
# GUI from GitHub on first start. That runtime dependency is not worth the saved
# router.
#
# --no-auth is never appropriate here. This process can read and write every
# configured remote and everything under /data, which is the same trust level as
# portainer.
#
# The image runs as root and ships an empty /data, so both mounts below are
# writable as-is and no init container is needed.
services:
  rclone:
    image: "rclone/rclone:latest"
    container_name: "rclone"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "proxy"
    environment:
      - TZ=America/New_York
      # Default would be /root/.config/rclone/rclone.conf. Pointed at the volume
      # below so remotes added through the GUI survive a recreate.
      - RCLONE_CONFIG=/config/rclone.conf
    command:
      - "gui"
      - "--addr=:5572"
      - "--api-addr=:5573"
      - "--user=${RCLONE_GUI_USER:?required - login for the rclone web GUI}"
      - "--pass=${RCLONE_GUI_PASS:?required - password for RCLONE_GUI_USER}"
      - "--rc-allow-origin=https://rclone.${SERVICE_DOMAIN:?required - the domain Traefik routes on}"
      # There is no browser in the container to open.
      - "--no-open-browser"
    volumes:
      # rclone.conf, which holds the cloud provider credentials. Nothing on the
      # host reads it, and it should not land anywhere near git.
      - "rclone-config:/config"
      # The host tree rclone exists to move. Kept as a bind mount because these
      # are the same media and data trees the other services and Samba use --
      # a named volume here would leave rclone with nothing to transfer.
      - "${BASE_VOLUME_DIRECTORY:?required - host path exposed to rclone as /data}:/data"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Web GUI
      - "traefik.http.routers.rclone.entrypoints=http"
      - "traefik.http.routers.rclone.rule=Host(`rclone.${SERVICE_DOMAIN:?required - the domain Traefik routes on}`)"
      - "traefik.http.middlewares.rclone-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.rclone.middlewares=rclone-https-redirect"
      # Required, unlike on single-service stacks. Two services are declared on
      # this container, so Traefik will not pick one for a router by itself and
      # drops the router outright: "cannot be linked automatically with multiple
      # Services". The https routers below name theirs for the same reason.
      - "traefik.http.routers.rclone.service=rclone"
      - "traefik.http.routers.rclone-secure.entrypoints=https"
      - "traefik.http.routers.rclone-secure.rule=Host(`rclone.${SERVICE_DOMAIN:?required - the domain Traefik routes on}`)"
      - "traefik.http.routers.rclone-secure.tls=true"
      - "traefik.http.routers.rclone-secure.service=rclone"
      # Rewrites a bare visit to the root into the login page, carrying all
      # three connection parameters; see the header for why partial ones fail.
      # /login already has a path, so it does not match this and there is no
      # redirect loop. The $$ is a literal dollar escaped past Compose
      # interpolation, not a variable.
      - "traefik.http.middlewares.rclone-api-url.redirectregex.regex=^https://rclone\\.${SERVICE_DOMAIN:?required - the domain Traefik routes on}/?$$"
      - "traefik.http.middlewares.rclone-api-url.redirectregex.replacement=https://rclone.${SERVICE_DOMAIN:?required - the domain Traefik routes on}/login?url=https%3A%2F%2Frclone-api.${SERVICE_DOMAIN:?required - the domain Traefik routes on}%2F&user=${RCLONE_GUI_USER:?required - login for the rclone web GUI}&pass=${RCLONE_GUI_PASS:?required - password for RCLONE_GUI_USER}"
      - "traefik.http.routers.rclone-secure.middlewares=rclone-api-url"
      - "traefik.http.services.rclone.loadbalancer.server.port=5572"
      # Remote control API, which the browser calls directly
      - "traefik.http.routers.rclone-api.entrypoints=http"
      - "traefik.http.routers.rclone-api.rule=Host(`rclone-api.${SERVICE_DOMAIN:?required - the domain Traefik routes on}`)"
      - "traefik.http.middlewares.rclone-api-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.rclone-api.middlewares=rclone-api-https-redirect"
      - "traefik.http.routers.rclone-api.service=rclone-api"
      - "traefik.http.routers.rclone-api-secure.entrypoints=https"
      - "traefik.http.routers.rclone-api-secure.rule=Host(`rclone-api.${SERVICE_DOMAIN:?required - the domain Traefik routes on}`)"
      - "traefik.http.routers.rclone-api-secure.tls=true"
      - "traefik.http.routers.rclone-api-secure.service=rclone-api"
      - "traefik.http.services.rclone-api.loadbalancer.server.port=5573"
networks:
  proxy:
    external: true
volumes:
  rclone-config:
