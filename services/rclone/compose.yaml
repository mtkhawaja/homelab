# Documentation Reference:
# https://rclone.org/docs/
# https://rclone.org/gui/
# https://rclone.org/install/#docker
#
# Required variables. Supply them however suits: common.env, a second
# --env-file, the shell environment, or Portainer's stack variables. Guarded,
# so Compose refuses to start rather than interpolating an empty string.
#
#   SERVICE_DOMAIN        - Traefik host rules, e.g. local.example.com
#   BASE_VOLUME_DIRECTORY - host path exposed to rclone as /data
#   RCLONE_GUI_USER       - login for the web GUI and the remote control API
#   RCLONE_GUI_PASS       - password for that login, A-Za-z0-9 only
#   RCLONE_BASIC_AUTH     - the same pair as user:bcrypt-hash, for Traefik:
#                           docker run --rm httpd:alpine htpasswd -nbB <user> '<password>'
#
# Sync and copy between local paths and around 70 cloud backends, with
# rsync-shaped semantics. services/garage is one of them, reachable as an S3
# remote at http://garage:3900 over `proxy`.
#
# `rclone gui` runs two listeners and refuses to share a port, exiting with
# "address already in use" if both are pointed at one. The browser calls the
# remote control API directly rather than through the GUI server, so the API
# cannot stay internal either. Both are published under a single hostname
# instead of two, with --rc-baseurl putting the API on a path:
#
#   rclone.$SERVICE_DOMAIN       - the web GUI          (port 5572)
#   rclone.$SERVICE_DOMAIN/api/  - the remote control API (port 5573)
#
# One hostname is not tidiness. A second hostname needs its own DNS record and
# its own certificate, and the GUI reaches the API by fetch rather than by
# navigation -- so an untrusted certificate or a missing record there fails
# silently, with no interstitial to click through, and looks exactly like a
# wrong password. Same origin also removes the CORS configuration entirely;
# --rc-allow-origin is not needed and is not set.
#
# The API router matches first on PathPrefix and carries the higher priority.
# rclone serves the prefix itself because of --rc-baseurl, so no stripprefix
# middleware is involved.
#
# The GUI learns which API to call only from a url= query parameter, and its
# login form has fields for the user and password but none for the URL, so the
# bare hostname reports "URL is not configured. Start the GUI launcher again."
# with nowhere to type an address. The redirectregex middleware rewrites the
# root to the login page with that URL.
#
# The credentials are deliberately not in that redirect. They come from the
# basic auth challenge Traefik puts in front of both routers: the browser
# prompts once, caches the Authorization header for the origin, and attaches it
# to the GUI's own API calls, which are same-origin thanks to --rc-baseurl.
# The GUI connects with empty user and pass, which it considers consistent and
# so does not reject, and the header the browser adds is what actually
# authenticates. Traefik forwards that header rather than consuming it, so
# rclone's --user/--pass is satisfied by the same one.
#
# An earlier version put user= and pass= in the redirect instead. It worked, but
# it meant Traefik handed the password to whoever loaded the page -- into the
# Location header, the container labels and any access log -- so anyone who
# could reach the hostname was logged in automatically, for a process that can
# read and write every configured remote and all of /data.
#
# Dropping only the password from that redirect does NOT work, and is worth not
# rediscovering: the GUI treats the presence of any one of url, user or pass as
# "connect now" and submits immediately rather than waiting for the form. url
# with user trips its "User and password must both be provided" check; url alone
# leaves both empty, connects unauthenticated, takes a 401, and the auth handler
# runs window.location.replace("/login?reason=auth") -- a full page load that
# discards the URL, since the store only persists after a successful connect.
# Both land back on "URL is not configured". Removing the credentials from the
# URL only works because basic auth supplies them out of band.
#
# The GUI strips the parameter from the address bar with a replace-style
# navigation as soon as it reads it, and after one successful connect the values
# live in localStorage, so the bare hostname works on its own from then on. A
# stale entry there survives a fixed deployment and looks exactly like the
# original fault: check in a private window before debugging this again.
#
# Every router names its service. Two services are declared on this container
# and Traefik will not pick one for a router by itself -- it drops the router
# with "cannot be linked automatically with multiple Services", which shows up
# as a 404 rather than as an error anywhere obvious.
#
# The GUI is embedded in the binary at build time as of rclone 1.74, so nothing
# is fetched at runtime. The older `rcd --rc-web-gui` serves both on one port
# already, but downloads the previous React GUI from GitHub on first start.
#
# --no-auth is never appropriate here. This process can read and write every
# configured remote and everything under /data, which is the same trust level
# as portainer.
#
# The image runs as root and ships an empty /data, so both mounts below are
# writable as-is and no init container is needed.
services:
  rclone:
    image: "rclone/rclone:latest"
    container_name: "rclone"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "proxy"
    environment:
      - TZ=America/New_York
      # Default would be /root/.config/rclone/rclone.conf. Pointed at the volume
      # below so remotes added through the GUI survive a recreate.
      - RCLONE_CONFIG=/config/rclone.conf
    command:
      - "gui"
      - "--addr=:5572"
      - "--api-addr=:5573"
      # Serves the API under /api so it shares the GUI's origin.
      - "--rc-baseurl=/api"
      - "--user=${RCLONE_GUI_USER:?required - login for the rclone web GUI}"
      - "--pass=${RCLONE_GUI_PASS:?required - password for RCLONE_GUI_USER, A-Za-z0-9 only}"
      # There is no browser in the container to open.
      - "--no-open-browser"
    volumes:
      # rclone.conf, which holds the cloud provider credentials. Nothing on the
      # host reads it, and it should not land anywhere near git.
      - "rclone-config:/config"
      # The host tree rclone exists to move. Kept as a bind mount because these
      # are the same media and data trees the other services and Samba use --
      # a named volume here would leave rclone with nothing to transfer.
      - "${BASE_VOLUME_DIRECTORY:?required - host path exposed to rclone as /data}:/data"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Remote control API, on /api of the same hostname. Matched first.
      - "traefik.http.routers.rclone-api.entrypoints=http"
      - "traefik.http.routers.rclone-api.rule=Host(`rclone.${SERVICE_DOMAIN:?required - the domain Traefik routes on}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.rclone-api.priority=100"
      - "traefik.http.middlewares.rclone-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.rclone-api.middlewares=rclone-https-redirect"
      - "traefik.http.routers.rclone-api.service=rclone-api"
      - "traefik.http.routers.rclone-api-secure.entrypoints=https"
      - "traefik.http.routers.rclone-api-secure.rule=Host(`rclone.${SERVICE_DOMAIN:?required - the domain Traefik routes on}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.rclone-api-secure.priority=100"
      - "traefik.http.routers.rclone-api-secure.tls=true"
      - "traefik.http.routers.rclone-api-secure.middlewares=rclone-auth"
      - "traefik.http.routers.rclone-api-secure.service=rclone-api"
      - "traefik.http.services.rclone-api.loadbalancer.server.port=5573"
      # Web GUI, catching everything else on the hostname.
      - "traefik.http.routers.rclone.entrypoints=http"
      - "traefik.http.routers.rclone.rule=Host(`rclone.${SERVICE_DOMAIN:?required - the domain Traefik routes on}`)"
      - "traefik.http.routers.rclone.priority=1"
      - "traefik.http.routers.rclone.middlewares=rclone-https-redirect"
      - "traefik.http.routers.rclone.service=rclone"
      - "traefik.http.routers.rclone-secure.entrypoints=https"
      - "traefik.http.routers.rclone-secure.rule=Host(`rclone.${SERVICE_DOMAIN:?required - the domain Traefik routes on}`)"
      - "traefik.http.routers.rclone-secure.priority=1"
      - "traefik.http.routers.rclone-secure.tls=true"
      - "traefik.http.routers.rclone-secure.service=rclone"
      # Basic auth at the proxy, in front of both the GUI and the API. Traefik
      # leaves the Authorization header on the request when it forwards it --
      # removeHeader defaults to false -- so the one header the browser sends
      # satisfies Traefik and then rclone's own --user/--pass as well. That is
      # what lets the redirect below carry no credentials while rclone keeps
      # requiring them, which still matters for anything reaching the container
      # directly over `proxy` rather than through Traefik.
      #
      # The value is user:bcrypt-hash, from:
      #   docker run --rm httpd:alpine htpasswd -nbB <user> '<password>'
      # It is passed as a variable rather than pasted in: a literal $ in a label
      # has to be doubled to $$ to survive Compose interpolation, and a bcrypt
      # hash is full of them, while a $ arriving from a variable's value is not
      # reinterpreted. The credentials behind the hash have to match
      # RCLONE_GUI_USER and RCLONE_GUI_PASS, or Traefik will accept the request
      # and rclone will then reject it.
      - "traefik.http.middlewares.rclone-auth.basicauth.users=${RCLONE_BASIC_AUTH:?required - user:bcrypt-hash pair for the proxy login}"
      # Rewrites a bare visit to the root into the login page. Only the URL is
      # carried: the credentials come from the browser's own basic auth session
      # now, so nothing secret ends up in a Location header or an access log.
      # Only the root matches, so /login and /api are untouched and there is no
      # redirect loop. The $$ is a literal dollar escaped past Compose
      # interpolation, not a variable.
      #
      # The host is matched as [^/]+ rather than spelled out, because the URL
      # Traefik matches here carries the port whenever the entrypoint is not on
      # 443, and an anchored hostname silently stops matching. The router's own
      # Host rule is what actually constrains this to rclone.$SERVICE_DOMAIN.
      - "traefik.http.middlewares.rclone-login.redirectregex.regex=^https?://[^/]+/?$$"
      - "traefik.http.middlewares.rclone-login.redirectregex.replacement=https://rclone.${SERVICE_DOMAIN:?required - the domain Traefik routes on}/login?url=https%3A%2F%2Frclone.${SERVICE_DOMAIN:?required - the domain Traefik routes on}%2Fapi%2F"
      # Auth first, so the redirect is only served to someone already through.
      - "traefik.http.routers.rclone-secure.middlewares=rclone-auth,rclone-login"
      - "traefik.http.services.rclone.loadbalancer.server.port=5572"
networks:
  proxy:
    external: true
volumes:
  rclone-config:
