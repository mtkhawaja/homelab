# Documentation Reference:
# https://hub.docker.com/r/sonatype/nexus3
# https://help.sonatype.com/en/installation-methods.html
#
# Required variables. Supply them however suits: common.env, a second
# --env-file, the shell environment, or Portainer's stack variables. Guarded,
# so Compose refuses to start rather than interpolating an empty string.
#
#   SERVICE_DOMAIN - Traefik host rules, e.g. local.example.com
#
# Two hostnames: the Nexus UI on nexus.$SERVICE_DOMAIN, and its Docker registry
# connector on container-registry.$SERVICE_DOMAIN. The connector needs its own
# hostname because the Docker client cannot address a registry by path.
#
# The service, container and router were all previously named `registry`, which
# collided with services/registry: the same router name and the same
# `registry.$SERVICE_DOMAIN` host rule were declared by both stacks, and Traefik
# resolved it non-deterministically. `registry` now unambiguously means the
# upstream registry, and this is `nexus`.
#
# /nexus-data was previously a bind mount at $BASE_VOLUME_DIRECTORY/nexus/data.
# Nexus alone reads it, and it is the blob store and database rather than
# anything browsed on the host, so it is now the named volume nexus-data. On an
# existing deployment copy the data across before starting the new definition,
# or Nexus comes up empty and generates a fresh admin password:
#
#   docker compose ... down
#   docker volume create nexus-data
#   docker run --rm \
#     -v "$BASE_VOLUME_DIRECTORY/nexus/data:/from:ro" -v nexus-data:/to \
#     alpine cp -a /from/. /to/
#   docker compose ... up --detach
#
# cp -a keeps uid 200 on every file, which the container runs as. A fresh
# install needs no chown: Docker seeds an empty named volume from the image's
# /nexus-data, ownership included.
#
# Watchtower upgrades this like everything else. Nexus migrates its database on
# upgrade and will not roll back, so keep a backup of the volume current.
services:
  nexus:
    # The unsuffixed tag is the Alpine image, which is the default since 3.91.
    image: "sonatype/nexus3:latest"
    container_name: "nexus"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "proxy"
    environment:
      - TZ=America/New_York
    ulimits:
      # Nexus holds more open files than the Linux default allows, and running
      # out can corrupt the blob store. Sonatype's floor is 65536.
      nofile:
        soft: 65536
        hard: 65536
    # The embedded database takes a while to flush on shutdown. Docker's 10s
    # default sends SIGKILL mid-write; Sonatype suggests 120s.
    stop_grace_period: 120s
    volumes:
      - "nexus-data:/nexus-data"
    healthcheck:
      # 200 once the server can answer read requests, 503 while starting or
      # degraded. Startup takes two to three minutes, hence the start_period.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/service/rest/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Nexus UI
      - "traefik.http.routers.nexus.entrypoints=http"
      - "traefik.http.routers.nexus.rule=Host(`nexus.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.middlewares.nexus-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.nexus.middlewares=nexus-https-redirect"
      - "traefik.http.routers.nexus-secure.entrypoints=https"
      - "traefik.http.routers.nexus-secure.rule=Host(`nexus.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.routers.nexus-secure.tls=true"
      - "traefik.http.routers.nexus-secure.service=nexus"
      - "traefik.http.services.nexus.loadbalancer.server.port=8081"
      # Docker registry connector
      - "traefik.http.routers.container-registry.entrypoints=http"
      - "traefik.http.routers.container-registry.rule=Host(`container-registry.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.middlewares.container-registry-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.container-registry.middlewares=container-registry-https-redirect"
      - "traefik.http.routers.container-registry-secure.entrypoints=https"
      - "traefik.http.routers.container-registry-secure.rule=Host(`container-registry.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.routers.container-registry-secure.tls=true"
      - "traefik.http.routers.container-registry-secure.service=container-registry"
      - "traefik.http.services.container-registry.loadbalancer.server.port=8082"
networks:
  proxy:
    external: true
volumes:
  nexus-data:
    name: nexus-data
