# Documentation Reference:
# https://hub.docker.com/r/apache/kafka
# https://kafka.apache.org/documentation/#kraft
# https://kafka.apache.org/documentation/#security_sasl_plain
# https://kafka.apache.org/documentation/#security_authz
#
# Required variables. Supply them however suits: common.env, a second
# --env-file, the shell environment, or Portainer's stack variables. Guarded,
# so Compose refuses to start rather than interpolating an empty string.
#
#   KAFKA_ADVERTISED_HOST  - hostname or IP that LAN clients use to reach the
#                            docker host, e.g. 192.168.1.10
#   KAFKA_ADMIN_PASSWORD   - password for the `admin` superuser
#   KAFKA_CLIENT_PASSWORD  - password for the `app` client principal
#
# Generate both with `openssl rand -base64 24`.
#
# ---------------------------------------------------------------------------
# Authentication and authorization
# ---------------------------------------------------------------------------
# Every listener speaks SASL_PLAINTEXT, including the controller. There is no
# anonymous access: a client that cannot authenticate never completes the
# handshake.
#
# The authorizer denies by default. `admin` is a superuser and can do anything;
# `app` authenticates but starts with no permissions at all, so it can neither
# see nor touch a topic until it is granted access.
#
# The admin tools need credentials of their own. Write them once inside the
# container; /tmp is cleared on restart, which is what you want for this:
#
#   docker exec -i kafka sh -c 'cat > /tmp/admin.properties' <<'EOF'
#   security.protocol=SASL_PLAINTEXT
#   sasl.mechanism=PLAIN
#   sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="<KAFKA_ADMIN_PASSWORD>";
#   EOF
#
# Then grant what a client actually needs:
#
#   docker exec kafka /opt/kafka/bin/kafka-acls.sh \
#     --bootstrap-server kafka:19092 --command-config /tmp/admin.properties \
#     --add --allow-principal User:app \
#     --operation Read --operation Write --operation Describe \
#     --topic <topic>
#
# A consumer also needs Read on its group:
#
#     --add --allow-principal User:app --operation Read --group <group-id>
#
# Clients connect with:
#
#   security.protocol=SASL_PLAINTEXT
#   sasl.mechanism=PLAIN
#   sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule \
#     required username="app" password="<KAFKA_CLIENT_PASSWORD>";
#
# PLAIN rather than SCRAM, deliberately. KRaft keeps SCRAM credentials in the
# cluster metadata and they have to be bootstrapped at format time with
# `kafka-storage format --add-scram`, but this image formats storage itself from
# its own entrypoint (KafkaDockerWrapper setup) and exposes no hook for extra
# format arguments. Using SCRAM would mean overriding the entrypoint and
# reimplementing that step. The tradeoff is real and worth knowing: these
# passwords sit in the broker's configuration, and rotating one requires a
# restart rather than an online credential update.
#
# SASL_PLAINTEXT, not SASL_SSL: credentials are hashed by the SASL exchange but
# message payloads cross the network in the clear. That is acceptable on a
# trusted LAN and is not acceptable across one that is not.
#
# ---------------------------------------------------------------------------
# Topology
# ---------------------------------------------------------------------------
# One node in combined broker+controller mode. This was three controllers and
# three brokers, which on a single docker host bought no availability at all --
# one host failure took the whole quorum with it -- while costing six JVMs and
# six copies of every setting. Internal topics use replication factor 1, which
# the image already defaults to.
#
# Kafka speaks its own protocol rather than HTTP, so there are no Traefik
# labels. Other stacks reach it over proxy at kafka:19092; LAN clients use the
# published port.
services:
  kafka:
    image: "apache/kafka:latest"
    container_name: "kafka"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "proxy"
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # INTERNAL serves other stacks over proxy; EXTERNAL is the published port.
      KAFKA_LISTENERS: "CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://${KAFKA_ADVERTISED_HOST:?required - hostname or IP LAN clients use to reach the docker host}:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:SASL_PLAINTEXT,INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "PLAIN"
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: "PLAIN"
      # username/password are the credentials this node uses when it connects to
      # itself; the user_<name> entries are the accounts it accepts. The
      # controller listener accepts only admin, since nothing else speaks it.
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="${KAFKA_ADMIN_PASSWORD:?required - password for the admin superuser}" user_admin="${KAFKA_ADMIN_PASSWORD:?required - password for the admin superuser}";'
      KAFKA_LISTENER_NAME_INTERNAL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="${KAFKA_ADMIN_PASSWORD:?required - password for the admin superuser}" user_admin="${KAFKA_ADMIN_PASSWORD:?required - password for the admin superuser}" user_app="${KAFKA_CLIENT_PASSWORD:?required - password for the app client principal}";'
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="${KAFKA_ADMIN_PASSWORD:?required - password for the admin superuser}" user_admin="${KAFKA_ADMIN_PASSWORD:?required - password for the admin superuser}" user_app="${KAFKA_CLIENT_PASSWORD:?required - password for the app client principal}";'
      KAFKA_AUTHORIZER_CLASS_NAME: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
      KAFKA_SUPER_USERS: "User:admin"
      # Default deny. Without this an authenticated client would be an
      # unrestricted one, which is most of the point of turning auth on.
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The image otherwise keeps its log dirs under /tmp, which is how this
      # stack used to lose every topic on restart.
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - "kafka-data:/var/lib/kafka/data"
networks:
  proxy:
    external: true
volumes:
  kafka-data:
