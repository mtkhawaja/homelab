# Documentation Reference:
# https://docs.immich.app/overview/quick-start/
# https://docs.immich.app/install/docker-compose
# https://docs.immich.app/install/environment-variables
#
# Adapted from:
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# Required variables. Supply them however suits: common.env, a second
# --env-file, the shell environment, or Portainer's stack variables. Guarded,
# so Compose refuses to start rather than interpolating an empty string.
#
#   SERVICE_DOMAIN        - Traefik host rules, e.g. local.example.com
#   BASE_VOLUME_DIRECTORY - host path for the photo library bind mount
#   IMMICH_DB_USER        - Postgres role owning the immich database
#   IMMICH_DB_PASSWORD    - password for that role, A-Za-z0-9 only
#
# The credentials are IMMICH_-prefixed rather than upstream's DB_USERNAME and
# DB_PASSWORD for the same reason paperless renamed its pair: bare POSTGRES_ and
# DB_ names are shared across stacks, so setting them for one silently changes
# the others. Postgres ignores them once the data directory exists, so a
# mismatch on an existing deployment surfaces as a failed login rather than as
# a reinitialised database. Upstream also requires the password be A-Za-z0-9
# with no punctuation or spaces.
#
# Only immich-server joins `proxy`. The database, redis and the machine learning
# container are private to this stack, so they stay on the internal network,
# following paperless and karakeep.
#
# The database is NOT services/postgres. Immich requires VectorChord and
# pgvecto.rs for its search embeddings, which the shared instance does not have,
# so a bundled database is a hard requirement rather than a preference.
#
# Tags float rather than pinning, matching the rest of the repo. Two of the
# three do not spell that `latest`:
#
#   - immich-server and immich-machine-learning publish no `latest` tag at all.
#     `release` is upstream's floating stable tag; `main` is the development
#     one and is not what this wants.
#   - ghcr.io/immich-app/postgres has no floating tag of any kind. Every tag
#     encodes the Postgres major plus the exact extension versions, so the bare
#     version tag below is already the least pinned form the registry offers.
#     Upstream additionally pins it by digest; that digest is dropped here.
#
# The tradeoff that buys: the database image no longer moves in lockstep with a
# verified server build, and the extension versions are coupled to the server
# version. If search breaks after an upgrade, this pairing is the first thing to
# check against the docker-compose.yml of the release being run.
#
# All four containers stay excluded from Watchtower for the same reason nexus
# is: an Immich release can run irreversible database migrations, and the
# server, machine learning and database images have to move together. With
# floating tags that means updates land on a deliberate `docker compose pull`
# rather than unattended overnight.
#
# If the database volume ever lands on spinning disks rather than an SSD, set
# DB_STORAGE_TYPE=HDD on the database service. It is left unset here because a
# named volume sits on the docker host's own disk.
services:
  database:
    image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0"
    container_name: "immich-database"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "immich"
    environment:
      POSTGRES_DB: "immich"
      POSTGRES_USER: "${IMMICH_DB_USER:?required - Postgres role owning the immich database}"
      POSTGRES_PASSWORD: "${IMMICH_DB_PASSWORD:?required - password for IMMICH_DB_USER, A-Za-z0-9 only}"
      # Detects silent corruption. Upstream sets it, and it can only be chosen
      # at initdb time, so it is not something to add later.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # Upstream requires the database on local disk rather than over the network,
    # which a named volume on the docker host satisfies.
    volumes:
      - "immich-db-data:/var/lib/postgresql/data"
    shm_size: "128mb"
    # The image ships its own healthcheck, which knows about the vector
    # extensions, so it is inherited rather than replaced with pg_isready.
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  redis:
    image: "docker.io/valkey/valkey:latest"
    container_name: "immich-redis"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "immich"
    # Job queue only. Immich rebuilds it, so nothing is persisted and there is
    # no volume to lose.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  immich-machine-learning:
    image: "ghcr.io/immich-app/immich-machine-learning:release"
    container_name: "immich-machine-learning"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "immich"
    environment:
      - TZ=America/New_York
    volumes:
      # Downloaded CLIP and face recognition models. Several GB, refetched from
      # upstream if lost, and read by nothing else.
      - "immich-model-cache:/cache"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  immich-server:
    image: "ghcr.io/immich-app/immich-server:release"
    container_name: "immich"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "proxy"
      - "immich"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      immich-machine-learning:
        condition: service_started
    environment:
      TZ: "America/New_York"
      DB_HOSTNAME: "database"
      DB_PORT: "5432"
      DB_DATABASE_NAME: "immich"
      DB_USERNAME: "${IMMICH_DB_USER:?required - Postgres role owning the immich database}"
      DB_PASSWORD: "${IMMICH_DB_PASSWORD:?required - password for IMMICH_DB_USER, A-Za-z0-9 only}"
      REDIS_HOSTNAME: "redis"
      REDIS_PORT: "6379"
      # Defaults to this already, but the machine learning container is only
      # reachable under this name, so it is spelled out rather than assumed.
      IMMICH_MACHINE_LEARNING_URL: "http://immich-machine-learning:3003"
    volumes:
      # The photo and video library. Stays a bind mount: it is a media tree of
      # the same class as the plex and audiobookshelf libraries, it belongs on
      # the pool rather than in /var/lib/docker, and it is what a backup reads.
      # Immich owns the layout inside it -- do not reorganise it by hand.
      - "${BASE_VOLUME_DIRECTORY:?required - host path for the photo library}/immich/data/library:/data"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.enable=true"
      - "traefik.http.routers.immich.entrypoints=http"
      - "traefik.http.routers.immich.rule=Host(`immich.${SERVICE_DOMAIN:?required - the domain Traefik routes on}`)"
      - "traefik.http.middlewares.immich-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.immich.middlewares=immich-https-redirect"
      - "traefik.http.routers.immich-secure.entrypoints=https"
      - "traefik.http.routers.immich-secure.rule=Host(`immich.${SERVICE_DOMAIN:?required - the domain Traefik routes on}`)"
      - "traefik.http.routers.immich-secure.tls=true"
      - "traefik.http.routers.immich-secure.service=immich"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
      - "traefik.docker.network=proxy"
networks:
  proxy:
    external: true
  immich:
    driver: bridge
volumes:
  immich-db-data:
  immich-model-cache:
