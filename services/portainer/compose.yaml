# Documentation Reference:
# https://docs.portainer.io/start/install-ce/server/docker/linux
#
# Required variables. Supply them however suits: common.env, a second
# --env-file, the shell environment, or Portainer's stack variables. Guarded,
# so Compose refuses to start rather than interpolating an empty string.
#
#   SERVICE_DOMAIN        - Traefik host rules, e.g. local.example.com
#   BASE_VOLUME_DIRECTORY - host path holding the env-files directory
#
# Both are also passed into the container, which is deliberate and specific to
# this service: stacks deployed from inside Portainer take their interpolation
# from Portainer's own environment rather than from a --env-file on a command
# line, so anything such a stack references has to be visible here.
#
# Mounting the docker socket is equivalent to giving Portainer root on the host.
# It is read-only, which stops container creation through the API, but that is
# not a security boundary on its own.
services:
  portainer:
    image: "portainer/portainer-ce:latest"
    container_name: "portainer"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "proxy"
    environment:
      SERVICE_DOMAIN: "${SERVICE_DOMAIN:?required, see header}"
      BASE_VOLUME_DIRECTORY: "${BASE_VOLUME_DIRECTORY:?required - host path holding the env-files directory}"
    volumes:
      # Host clock, so timestamps in the UI match the host.
      - "/etc/localtime:/etc/localtime:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # The env files themselves, so stacks deployed from the UI can reference
      # them. A named host consumer, so this stays a bind mount.
      - "${BASE_VOLUME_DIRECTORY:?required - host path holding the env-files directory}/env-files:/env-files:ro"
      # Portainer's own database, users and stack definitions.
      - "portainer_data:/data"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.entrypoints=http"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.middlewares.portainer-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.portainer.middlewares=portainer-https-redirect"
      - "traefik.http.routers.portainer-secure.entrypoints=https"
      - "traefik.http.routers.portainer-secure.rule=Host(`portainer.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.routers.portainer-secure.tls=true"
      - "traefik.http.routers.portainer-secure.service=portainer"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.docker.network=proxy"
networks:
  proxy:
    external: true
volumes:
  portainer_data:
    # Pinned, so it resolves to `portainer_data` rather than being namespaced to
    # `portainer_portainer_data`. Leave it: the existing volume on the host
    # carries the unprefixed name.
    name: portainer_data
