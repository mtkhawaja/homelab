# Documentation Reference:
# https://homarr.dev/docs/getting-started/installation/docker
# https://homarr.dev/docs/getting-started/after-the-installation
#
# Required variables. Supply them however suits: common.env, a second
# --env-file, the shell environment, or Portainer's stack variables. Guarded,
# so Compose refuses to start rather than interpolating an empty string.
#
#   SERVICE_DOMAIN - Traefik host rules, e.g. local.example.com
#   HOMARR_SECRET_ENCRYPTION_KEY - encrypts the integration credentials Homarr
#     stores in its database. Generate with `openssl rand -hex 32`. Set it
#     before the first start and do not change it afterwards: rotating it
#     leaves every stored integration secret undecryptable. Compose refuses to
#     start rather than running with a blank key.
#
# This is Homarr v1 on the homarr-labs image. The old ajnart image kept its
# state in the `homarr-data` volume across three mount points; v1 uses a single
# /appdata and cannot read that layout, so this points at a new volume.
#
# `homarr-data` is deliberately left in place on the host, not deleted. v1 does
# not migrate it automatically: start the old container, export a ZIP from its
# settings, then upload that during the v1 onboarding wizard. Keep the
# encryption key the export hands you, or the integrations and users in it will
# not decrypt. Remove the old volume once the import is confirmed.
services:
  homarr:
    image: "ghcr.io/homarr-labs/homarr:latest"
    container_name: "homarr"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "proxy"
    environment:
      - TZ=America/New_York
      # See the header for how to generate this and why it must not be rotated.
      - SECRET_ENCRYPTION_KEY=${HOMARR_SECRET_ENCRYPTION_KEY:?generate with `openssl rand -hex 32` and set it in an env file}
    volumes:
      # Optional upstream, kept because the Docker integration widget needs it.
      # Read-write: Homarr can start and stop containers from the dashboard.
      - "/var/run/docker.sock:/var/run/docker.sock"
      # Everything v1 persists, including its SQLite database.
      - "homarr-appdata:/appdata"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homarr.entrypoints=http"
      - "traefik.http.routers.homarr.rule=Host(`homarr.$SERVICE_DOMAIN`)"
      - "traefik.http.middlewares.homarr-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.homarr.middlewares=homarr-https-redirect"
      - "traefik.http.routers.homarr-secure.entrypoints=https"
      - "traefik.http.routers.homarr-secure.rule=Host(`homarr.$SERVICE_DOMAIN`)"
      - "traefik.http.routers.homarr-secure.tls=true"
      - "traefik.http.routers.homarr-secure.service=homarr"
      - "traefik.http.services.homarr.loadbalancer.server.port=7575"
      - "traefik.docker.network=proxy"
networks:
  proxy:
    external: true
volumes:
  homarr-appdata:
