# Documentation Reference:
# https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/
# https://prometheus.io/docs/prometheus/latest/installation/
# https://grafana.com/docs/loki/latest/setup/install/docker/
#
# Prometheus for metrics, Loki for logs, Grafana over both, plus node_exporter
# scraping host metrics and Grafana Alloy shipping host and container logs.
#
# Required variables. Supply them however suits: common.env, a second
# --env-file, the shell environment, or Portainer's stack variables. Guarded,
# so Compose refuses to start rather than interpolating an empty string.
#
#   SERVICE_DOMAIN        - Traefik host rules, e.g. local.example.com
#   BASE_VOLUME_DIRECTORY - host path for the config and data bind mounts
#
# These stay five containers rather than one. node_exporter needs the host PID
# namespace and a root filesystem mount, and Alloy needs the Docker socket;
# folding either into a shared container would extend that reach to everything
# else. Independent restarts matter too, since bouncing Loki should not take
# Grafana down.
#
# Grafana's bind mount needs `chown 472` and Prometheus's needs `chown 65534`
# on the host before the first start.
#
# Alloy replaces Promtail, which reached end of life on 2 March 2026. Copy
# alloy/data/config/config.alloy to
# $BASE_VOLUME_DIRECTORY/plg/alloy/data/config/ before starting, and check it
# with:
#
#   docker run --rm -v <path>/config.alloy:/etc/alloy/config.alloy:ro \
#     grafana/alloy:latest validate /etc/alloy/config.alloy
#
# The old promtail container and its config directory can be removed once Alloy
# is confirmed shipping.
services:
  grafana:
    image: "grafana/grafana:latest"
    container_name: "grafana"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "proxy"
    environment:
      - TZ=America/New_York
    volumes:
      # Verdict: convert. Only Grafana reads this; it is the dashboard and user
      # database rather than anything browsed on the host. Left as a bind mount
      # so the move does not orphan it.
      - "${BASE_VOLUME_DIRECTORY:?required, see header}/plg/grafana/data/grafana:/var/lib/grafana"
      # Provisioned datasources, edited on the host.
      - "${BASE_VOLUME_DIRECTORY:?required, see header}/plg/grafana/data/provisioning/datasources:/etc/grafana/provisioning/datasources"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.entrypoints=http"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.middlewares.grafana-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.grafana.middlewares=grafana-https-redirect"
      - "traefik.http.routers.grafana-secure.entrypoints=https"
      - "traefik.http.routers.grafana-secure.rule=Host(`grafana.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.routers.grafana-secure.tls=true"
      - "traefik.http.routers.grafana-secure.service=grafana"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"

  prometheus:
    image: "prom/prometheus:latest"
    container_name: "prometheus"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "proxy"
    environment:
      - TZ=America/New_York
    volumes:
      # Verdict: convert. The TSDB is Prometheus's alone.
      - "${BASE_VOLUME_DIRECTORY:?required, see header}/plg/prometheus/data/prometheus:/prometheus"
      # Scrape config, edited on the host.
      - "${BASE_VOLUME_DIRECTORY:?required, see header}/plg/prometheus/data/config/prometheus.yaml:/etc/prometheus/prometheus.yml"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.entrypoints=http"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.middlewares.prometheus-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.prometheus.middlewares=prometheus-https-redirect"
      - "traefik.http.routers.prometheus-secure.entrypoints=https"
      - "traefik.http.routers.prometheus-secure.rule=Host(`prometheus.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.routers.prometheus-secure.tls=true"
      - "traefik.http.routers.prometheus-secure.service=prometheus"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.docker.network=proxy"

  node_exporter:
    image: "quay.io/prometheus/node-exporter:latest"
    container_name: "prometheus-node-exporter"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "proxy"
    # Host PID namespace and a read-only root mount are what let this report on
    # the host rather than on its own container. This is why it stays separate.
    pid: "host"
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro,rslave"

  loki:
    image: "grafana/loki:latest"
    container_name: "loki"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "proxy"
    environment:
      - TZ=America/New_York
    command: "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - "${BASE_VOLUME_DIRECTORY:?required, see header}/plg/loki/data/config/local-config.yaml:/etc/loki/local-config.yaml"
      # Chunks and the index. The config sets path_prefix to /tmp/loki, and
      # nothing was mounted there, so every log was discarded whenever the
      # container restarted. The mount point matches path_prefix rather than
      # being somewhere tidier, so the config needs no change.
      - "loki-data:/tmp/loki"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.entrypoints=http"
      - "traefik.http.routers.loki.rule=Host(`loki.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.middlewares.loki-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.loki.middlewares=loki-https-redirect"
      - "traefik.http.routers.loki-secure.entrypoints=https"
      - "traefik.http.routers.loki-secure.rule=Host(`loki.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.routers.loki-secure.tls=true"
      - "traefik.http.routers.loki-secure.service=loki"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"
      - "traefik.docker.network=proxy"

  alloy:
    image: "grafana/alloy:latest"
    container_name: "alloy"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "proxy"
    environment:
      - TZ=America/New_York
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki
    volumes:
      - "${BASE_VOLUME_DIRECTORY:?required, see header}/plg/alloy/data/config/config.alloy:/etc/alloy/config.alloy:ro"
      # Host logs, which is half the job.
      - "/var/log:/var/log:ro"
      # Container logs come through the Docker API rather than by tailing
      # /var/lib/docker/containers, so that mount is no longer needed.
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # Write-ahead log and read positions. Without this Alloy re-reads every
      # log file from the start after a restart.
      - "alloy-data:/var/lib/alloy/data"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alloy.entrypoints=http"
      - "traefik.http.routers.alloy.rule=Host(`alloy.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.middlewares.alloy-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.alloy.middlewares=alloy-https-redirect"
      - "traefik.http.routers.alloy-secure.entrypoints=https"
      - "traefik.http.routers.alloy-secure.rule=Host(`alloy.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.routers.alloy-secure.tls=true"
      - "traefik.http.routers.alloy-secure.service=alloy"
      - "traefik.http.services.alloy.loadbalancer.server.port=12345"
      - "traefik.docker.network=proxy"
networks:
  proxy:
    external: true
volumes:
  loki-data:
  alloy-data:
