# Documentation Reference:
# https://docs.stirlingpdf.com/Production-Deployment-Guide#docker-compose-setup
#
# Required variables. Supply them however suits: common.env, a second
# --env-file, the shell environment, or Portainer's stack variables. Guarded,
# so Compose refuses to start rather than interpolating an empty string.
#
#   SERVICE_DOMAIN - Traefik host rules, e.g. local.example.com
#
# This previously used a SELF_HOSTED_SERVER_URL variable that was defined in no
# env file, so both host rules rendered as Host(`stirling-pdf.`) and the service
# was unroutable. It now uses SERVICE_DOMAIN like every other service.
services:
  stirling-pdf:
    image: "stirlingtools/stirling-pdf:latest"
    container_name: "stirling-pdf"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "proxy"
    environment:
      # Core Settings
      - SECURITY_ENABLELOGIN=true            # Enable user authentication
      # Language & Localization
      - LANGS=en_US                          # Change to your locale
      - TZ=America/New_York                  # System Timezone
      # System Configuration
      - SYSTEM_DEFAULTLOCALE=en-US           # Default locale
      - SYSTEM_GOOGLEVISIBILITY=false        # Hide from search engines
      - SYSTEM_ROOTURIPATH=/                 # Base URL path
      - SYSTEM_CONNECTIONTIMEOUTMINUTES=5    # Connection timeout
      - SYSTEM_MAXFILESIZE=2000              # Max file size in MB
      - SYSTEM_CUSTOMSTATICFILEPATH=/customFiles/static/  # Custom files path
    volumes:
      - "stirling-pdf-tessdata:/usr/share/tessdata"    # OCR language files
      - "stirling-pdf-configs:/configs"                # Settings & database
      - "stirling-pdf-logs:/logs"                      # Application logs
      - "stirling-pdf-customFiles:/customFiles"        # Custom branding files
      - "stirling-pdf-pipeline:/pipeline"              # Automation configs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stirling-pdf.entrypoints=http"
      - "traefik.http.routers.stirling-pdf.rule=Host(`stirling-pdf.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.middlewares.stirling-pdf-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.stirling-pdf.middlewares=stirling-pdf-https-redirect"
      - "traefik.http.routers.stirling-pdf-secure.entrypoints=https"
      - "traefik.http.routers.stirling-pdf-secure.rule=Host(`stirling-pdf.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.routers.stirling-pdf-secure.tls=true"
      - "traefik.http.routers.stirling-pdf-secure.service=stirling-pdf"
      - "traefik.http.services.stirling-pdf.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy"
networks:
  proxy:
    external: true
volumes:
  stirling-pdf-tessdata:
  stirling-pdf-configs:
  stirling-pdf-logs:
  stirling-pdf-customFiles:
  stirling-pdf-pipeline:
