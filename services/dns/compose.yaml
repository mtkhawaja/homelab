# Documentation Reference:
# https://github.com/coredns/coredns
# https://coredns.io/manual/toc/
#
# Tailnet-only DNS resolver providing split DNS for Tailscale clients.
# See ./TAILSCALE.md for the design and setup steps.
#
# This does not replace services/pi-hole. That is the LAN's resolver and does the
# ad blocking; this one answers the tailnet and resolves only the lab's own
# hostnames. Both are intentional.
#
# CoreDNS is used rather than dnsmasq because the project publishes its own
# image, and because the mounted Corefile is the complete configuration. There
# are no image defaults to merge with or discover at runtime.
#
# Required variables. Supply them however suits: common.env, a second
# --env-file, the shell environment, or Portainer's stack variables. Guarded,
# so Compose refuses to start rather than interpolating an empty string.
#
#   BASE_VOLUME_DIRECTORY - host path for the Corefile bind mount
services:
  coredns:
    image: "coredns/coredns:latest"
    container_name: "coredns"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    # Host networking so CoreDNS can bind directly to the tailscale0 interface.
    # This service answers DNS on port 53 rather than HTTP, so it deliberately
    # carries no Traefik labels and does not join the proxy network.
    network_mode: "host"
    cap_add:
      # Port 53 is below 1024. Granted explicitly so binding does not depend on
      # the container happening to run as root.
      - "NET_BIND_SERVICE"
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      # Generate this file with ./generate-dns-config.sh and save it here. The
      # path is absolute because a stack deployed through Portainer resolves
      # relative paths inside Portainer's own container, not on the host.
      - "${BASE_VOLUME_DIRECTORY:?required - host path for the Corefile bind mount}/dns/data/Corefile:/etc/coredns/Corefile:ro"
