# Documentation Reference:
# https://garagehq.deuxfleurs.fr/documentation/quick-start/
# https://garagehq.deuxfleurs.fr/documentation/cookbook/real-world/
#
# S3-compatible object storage, running as a single node. Replaces MinIO.
#
# Required variables. Supply them however suits: common.env, a second
# --env-file, the shell environment, or Portainer's stack variables. Guarded,
# so Compose refuses to start rather than interpolating an empty string.
#
#   SERVICE_DOMAIN        - Traefik host rules, e.g. local.example.com
#   BASE_VOLUME_DIRECTORY - host path for the garage.toml bind mount
#
# Generate the config with ./generate-garage-config.sh and save it to
# ${BASE_VOLUME_DIRECTORY:?required - host path for the garage.toml bind mount}/garage/data/garage.toml before the first start. It
# carries the RPC secret and admin token, so it is not kept in git.
#
# Traefik routes the S3 API only. 3901 (RPC, multi-node clustering), 3902
# (static site hosting) and 3903 (admin API) stay internal and unpublished.
#
# This routes path-style URLs, https://garage.<domain>/<bucket>/<key>. Some
# clients default to virtual-host style, https://<bucket>.garage.<domain>/<key>,
# which needs a wildcard route and a certificate one level deeper than
# *.local.<domain> covers. Set path-style in the client instead.
#
# After the first start, create a key and a bucket:
#   docker exec garage /garage status
#   docker exec garage /garage key create <name>
#   docker exec garage /garage bucket create <bucket>
#   docker exec garage /garage bucket allow --read --write <bucket> --key <name>
services:
  garage:
    # Upstream advises a fixed tag rather than latest. Pinned also keeps
    # Watchtower from moving a storage node across a release unattended.
    image: "dxflrs/garage:v2.3.0"
    container_name: "garage"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "proxy"
    environment:
      - TZ=America/New_York
    # --single-node applies the cluster layout on startup, replacing the manual
    # `garage layout assign` and `garage layout apply` steps needed pre-2.3.
    command: ["/garage", "server", "--single-node"]
    volumes:
      # Generated, not committed: contains rpc_secret and admin_token. The path
      # is absolute because a stack deployed through Portainer resolves relative
      # paths inside Portainer's own container rather than on the host.
      - "${BASE_VOLUME_DIRECTORY:?required - host path for the garage.toml bind mount}/garage/data/garage.toml:/etc/garage.toml:ro"
      # Object index. Upstream prefers this on SSD, and it is the volume worth
      # backing up: losing it orphans the data below.
      - "garage-meta:/var/lib/garage/meta"
      # Object contents.
      - "garage-data:/var/lib/garage/data"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.garage.entrypoints=http"
      - "traefik.http.routers.garage.rule=Host(`garage.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.middlewares.garage-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.garage.middlewares=garage-https-redirect"
      - "traefik.http.routers.garage-secure.entrypoints=https"
      - "traefik.http.routers.garage-secure.rule=Host(`garage.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.routers.garage-secure.tls=true"
      - "traefik.http.routers.garage-secure.service=garage"
      - "traefik.http.services.garage.loadbalancer.server.port=3900"
      - "traefik.docker.network=proxy"
networks:
  proxy:
    external: true
volumes:
  garage-meta:
  garage-data:
