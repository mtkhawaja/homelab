# Documentation Reference:
# https://www.audiobookshelf.org/docs/documentation/install/docker/
# https://github.com/advplyr/audiobookshelf/blob/master/docker-compose.yml
#
# Required variables. Supply them however suits: common.env, a second
# --env-file, the shell environment, or Portainer's stack variables. Guarded,
# so Compose refuses to start rather than interpolating an empty string.
#
#   SERVICE_DOMAIN        - Traefik host rules, e.g. local.example.com
#   BASE_VOLUME_DIRECTORY - host path for the two library bind mounts
#
# Upstream publishes 13378:80 and mounts all four paths relatively. The port is
# dropped, since Traefik is the only ingress, and the two state paths become
# named volumes.
#
# The image runs as root and has no PUID/PGID handling of its own, so it is
# pinned to 1000:1000 to match the ownership of the shared library trees.
# Audiobookshelf writes into them -- downloaded podcast episodes land in the
# podcast folder -- and as root those files would be undeletable over Samba and
# FTP.
#
# Docker creates an empty named volume owned by root, which a container running
# as 1000 then cannot write to: the server dies in a loop on
# `EACCES: mkdir '/metadata/logs'`. The init service below fixes the ownership
# and exits before the server starts. It is a container rather than a documented
# `chown` step because the volume names are namespaced by the project, so a step
# run by hand targets the wrong volumes under Portainer, where the stack name
# becomes the project name.
services:
  # One-shot. Runs as root, chowns the two volumes, exits. Idempotent, so it
  # runs on every `up` and not just the first.
  audiobookshelf-init:
    image: "ghcr.io/advplyr/audiobookshelf:latest"
    container_name: "audiobookshelf-init"
    restart: "no"
    security_opt:
      - no-new-privileges:true
    user: "0:0"
    entrypoint: ["chown", "1000:1000", "/config", "/metadata"]
    volumes:
      - "audiobookshelf-config:/config"
      - "audiobookshelf-metadata:/metadata"

  audiobookshelf:
    image: "ghcr.io/advplyr/audiobookshelf:latest"
    container_name: "audiobookshelf"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    # Owns the files written into the library bind mounts; see header.
    user: "1000:1000"
    depends_on:
      audiobookshelf-init:
        condition: service_completed_successfully
    networks:
      - "proxy"
    environment:
      - TZ=America/New_York
    volumes:
      # SQLite database. Upstream requires it on local disk rather than over the
      # network, which a named volume on the docker host satisfies.
      - "audiobookshelf-config:/config"
      # Covers, author images, logs and backups. Nothing on the host reads them.
      - "audiobookshelf-metadata:/metadata"
      # Libraries stay bind mounts: these are the same media trees reachable
      # over Samba and FTP, and are filled from the host rather than through
      # Audiobookshelf.
      - "${BASE_VOLUME_DIRECTORY:?required - host path for the libraries}/audiobookshelf/data/audiobooks:/audiobooks"
      - "${BASE_VOLUME_DIRECTORY:?required - host path for the libraries}/audiobookshelf/data/podcasts:/podcasts"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.audiobookshelf.entrypoints=http"
      - "traefik.http.routers.audiobookshelf.rule=Host(`audiobookshelf.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.middlewares.audiobookshelf-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.audiobookshelf.middlewares=audiobookshelf-https-redirect"
      - "traefik.http.routers.audiobookshelf-secure.entrypoints=https"
      - "traefik.http.routers.audiobookshelf-secure.rule=Host(`audiobookshelf.${SERVICE_DOMAIN:?required, see header}`)"
      - "traefik.http.routers.audiobookshelf-secure.tls=true"
      - "traefik.http.routers.audiobookshelf-secure.service=audiobookshelf"
      - "traefik.http.services.audiobookshelf.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
networks:
  proxy:
    external: true
volumes:
  audiobookshelf-config:
  audiobookshelf-metadata:
