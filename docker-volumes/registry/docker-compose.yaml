services:
  registry:
    image: registry:3
    restart: always
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      # Coordinates chunked uploads. Generate with: openssl rand -hex 32
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET}
      # Auth — htpasswd file MUST be bcrypt-hashed (-B flag)
      # Generate with: docker run --rm --entrypoint htpasswd httpd:2 -Bbn <user> <pass> > ./auth/htpasswd
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      # Enable image deletion (needed for garbage collection)
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      # Quieter logs for production (default is debug)
      REGISTRY_LOG_LEVEL: warn
      # Disable OpenTelemetry — by default it tries localhost:4318 and spams logs
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      LOCAL_DOMAIN_NAME: ${LOCAL_DOMAIN_NAME}
      BASE_VOLUME_DIRECTORY: ${BASE_VOLUME_DIRECTORY}
    volumes:
      - registry-data:/var/lib/registry
      - ${BASE_VOLUME_DIRECTORY}/registry/data/auth:/auth:ro

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.registry.entrypoints=http"
      - "traefik.http.routers.registry.rule=Host(`registry.local.$LOCAL_DOMAIN_NAME`)"
      - "traefik.http.routers.registry.middlewares=registry-https-redirect"
      - "traefik.http.routers.registry-secure.entrypoints=https"
      - "traefik.http.routers.registry-secure.rule=Host(`registry.local.$LOCAL_DOMAIN_NAME`)"
      - "traefik.http.routers.registry-secure.tls=true"
      - "traefik.http.routers.registry-secure.service=registry"
      - "traefik.http.services.registry.loadbalancer.server.port=5000"
      - "traefik.http.middlewares.registry-https-redirect.redirectscheme.scheme=https"
      # Required header — Docker clients check this to confirm they're talking to a v2 registry
      - "traefik.http.middlewares.registry-headers.headers.customresponseheaders.Docker-Distribution-API-Version=registry/2.0"
      - "traefik.http.routers.registry.middlewares=registry-headers"

volumes:
  registry-data:
    driver: local

networks:
  proxy:
    external: true