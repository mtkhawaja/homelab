# Documentation Reference:
# https://docs.linuxserver.io/images/docker-calibre-web/
#
# Required variables (docker-volumes/env-files/common.env):
#   SERVICE_DOMAIN        - Traefik host rules, e.g. local.example.com
#   BASE_VOLUME_DIRECTORY - host path for the /books bind mount
services:
  calibre-web:
    image: "lscr.io/linuxserver/calibre-web:latest"
    container_name: "calibre-web"
    restart: "unless-stopped"
    security_opt:
      - no-new-privileges:true
    networks:
      - "proxy"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      # Adds the Calibre binaries needed for ebook conversion.
      - DOCKER_MODS=linuxserver/mods:universal-calibre #optional
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1 #optional
    volumes:
      # Application state (settings, users, app database) — no host access needed.
      - "calibre-web-config:/config"
      # Library stays a bind mount so it remains reachable over Samba/FTP.
      - "$BASE_VOLUME_DIRECTORY/calibre/data/books:/books"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.calibre.entrypoints=http"
      - "traefik.http.routers.calibre.rule=Host(`calibre.$SERVICE_DOMAIN`)"
      - "traefik.http.middlewares.calibre-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.calibre.middlewares=calibre-https-redirect"
      - "traefik.http.routers.calibre-secure.entrypoints=https"
      - "traefik.http.routers.calibre-secure.rule=Host(`calibre.$SERVICE_DOMAIN`)"
      - "traefik.http.routers.calibre-secure.tls=true"
      - "traefik.http.routers.calibre-secure.service=calibre"
      - "traefik.http.services.calibre.loadbalancer.server.port=8083"
      - "traefik.docker.network=proxy"
networks:
  proxy:
    external: true
volumes:
  calibre-web-config:
