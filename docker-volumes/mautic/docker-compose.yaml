services:
  mautic:
    image: mautic/mautic:latest
    restart: unless-stopped
    depends_on:
      mautic-db:
        condition: service_healthy
    environment:
      DOCKER_MAUTIC_ROLE: mautic_web
      DOCKER_MAUTIC_RUN_MIGRATIONS: "true"
      MAUTIC_DB_HOST: ${MAUTIC_DB_HOST:-mautic-db}
      MAUTIC_DB_PORT: ${MAUTIC_DB_PORT:-3306}
      MAUTIC_DB_DATABASE: ${MAUTIC_DB_DATABASE}
      MAUTIC_DB_USER: ${MAUTIC_DB_USER}
      MAUTIC_DB_PASSWORD: ${MAUTIC_DB_PASSWORD}
      LOCAL_DOMAIN_NAME: ${LOCAL_DOMAIN_NAME}
    volumes:
      - mautic_config:/var/www/html/config
      - mautic_logs:/var/www/html/var/logs
      - mautic_media:/var/www/html/docroot/media
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.mautic.entrypoints=http"
      - "traefik.http.routers.mautic.rule=Host(`mautic.local.$LOCAL_DOMAIN_NAME`)"
      - "traefik.http.routers.mautic.middlewares=mautic-https-redirect"
      - "traefik.http.routers.mautic-secure.entrypoints=https"
      - "traefik.http.routers.mautic-secure.rule=Host(`mautic.local.$LOCAL_DOMAIN_NAME`)"
      - "traefik.http.routers.mautic-secure.tls=true"
      - "traefik.http.routers.mautic-secure.service=mautic"
      - "traefik.http.services.mautic.loadbalancer.server.port=80"
      - "traefik.http.middlewares.mautic-https-redirect.redirectscheme.scheme=https"
    networks:
      - mautic-internal
      - proxy

  mautic-worker:
    image: mautic/mautic:latest
    restart: unless-stopped
    depends_on:
      mautic-db:
        condition: service_healthy
      mautic:
        condition: service_started
    environment:
      DOCKER_MAUTIC_ROLE: mautic_worker
      MAUTIC_DB_HOST: ${MAUTIC_DB_HOST:-mautic-db}
      MAUTIC_DB_PORT: ${MAUTIC_DB_PORT:-3306}
      MAUTIC_DB_DATABASE: ${MAUTIC_DB_DATABASE}
      MAUTIC_DB_USER: ${MAUTIC_DB_USER}
      MAUTIC_DB_PASSWORD: ${MAUTIC_DB_PASSWORD}
    volumes:
      - mautic_config:/var/www/html/config
      - mautic_logs:/var/www/html/var/logs
      - mautic_media:/var/www/html/docroot/media
    networks:
      - mautic-internal

  mautic-cron:
    image: mautic/mautic:latest
    restart: unless-stopped
    depends_on:
      mautic-db:
        condition: service_healthy
      mautic:
        condition: service_started
    environment:
      DOCKER_MAUTIC_ROLE: mautic_cron
      MAUTIC_DB_HOST: ${MAUTIC_DB_HOST:-mautic-db}
      MAUTIC_DB_PORT: ${MAUTIC_DB_PORT:-3306}
      MAUTIC_DB_DATABASE: ${MAUTIC_DB_DATABASE}
      MAUTIC_DB_USER: ${MAUTIC_DB_USER}
      MAUTIC_DB_PASSWORD: ${MAUTIC_DB_PASSWORD}
    volumes:
      - mautic_config:/var/www/html/config
      - mautic_logs:/var/www/html/var/logs
      - mautic_media:/var/www/html/docroot/media
    networks:
      - mautic-internal

  mautic-db:
    image: mariadb:lts-noble
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: mautic
      MARIADB_USER: ${MAUTIC_DB_USER}
      MARIADB_PASSWORD: ${MAUTIC_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - mautic_db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mautic-internal

networks:
  proxy:
    external: true
  mautic-internal:
    driver: bridge

volumes:
  # Mautic Volumes
  mautic_config:
  mautic_logs:
  mautic_media:
  # Database Volumes
  mautic_db_data:
